<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>
  To-Do</title>

<!-- React, without needing npm/webpack/vite -->
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<link rel="stylesheet" href="todo.css" />
</head>
<body>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

const API_BASE = "https://to-do-list-fzlx.onrender.com";
const TOKEN_STORAGE_KEY = "todo_token";
const RECURRENCE_OPTIONS = ["none", "daily", "weekly", "monthly"];

async function apiFetch(token, path, options = {}) {
  const res = await fetch(API_BASE + path, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      ...(token ? { Authorization: "Bearer " + token } : {}),
      ...(options.headers || {}),
    },
  });

  if (!res.ok) {
    let detail = res.statusText;
    try {
      const body = await res.json();
      detail = body.detail || detail;
    } catch (_) {
    }
    const err = new Error(detail);
    err.status = res.status;
    throw err;
  }

  if (res.status === 204) return null;
  return res.json();
}

function toDatetimeLocalValue(isoString) {
  if (!isoString) return "";
  return isoString.slice(0, 16);
}

function fromDatetimeLocalValue(value) {
  return value ? value : null;
}

function sortByPriority(tasks, priorityOrder) {
  if (!priorityOrder || priorityOrder.length === 0) return tasks;
  const orderIndex = new Map(priorityOrder.map((id, i) => [id, i]));
  return [...tasks].sort((a, b) => {
    const aRank = orderIndex.has(a.id) ? orderIndex.get(a.id) : Infinity;
    const bRank = orderIndex.has(b.id) ? orderIndex.get(b.id) : Infinity;
    return aRank - bRank;
  });
}

function AuthScreen({ onAuthenticated }) {
  const [mode, setMode] = useState("login"); // "login" | "signup"
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState(null);
  const [submitting, setSubmitting] = useState(false);

  async function handleSubmit(e) {
    e.preventDefault();
    setError(null);
    setSubmitting(true);
    try {
      const data = await apiFetch(null, mode === "login" ? "/login" : "/signup", {
        method: "POST",
        body: JSON.stringify({ email, password }),
      });
      onAuthenticated(data.access_token);
    } catch (err) {
      setError(err.message);
    } finally {
      setSubmitting(false);
    }
  }

  return (
    <div>
      <h1 style={{ textAlign: "center" }}>To-Do</h1>

      <div className="auth-tabs">
        <button
          type="button"
          className={mode === "login" ? "primary" : ""}
          onClick={() => { setMode("login"); setError(null); }}
        >
          Log in
        </button>
        <button
          type="button"
          className={mode === "signup" ? "primary" : ""}
          onClick={() => { setMode("signup"); setError(null); }}
        >
          Sign up
        </button>
      </div>

      {error && <div className="error-banner">Something went wrong: {error}</div>}

      <form onSubmit={handleSubmit} className="auth-form">
        <input
          type="email"
          placeholder="Email"
          value={email}
          onChange={(e) => setEmail(e.target.value)}
          required
        />
        <input
          type="password"
          placeholder="Password"
          value={password}
          onChange={(e) => setPassword(e.target.value)}
          minLength={mode === "signup" ? 8 : undefined}
          required
        />
        <button type="submit" className="primary" disabled={submitting}>
          {mode === "login" ? "Log in" : "Sign up"}
        </button>
      </form>
    </div>
  );
}

function TodoApp({ token, onLogout }) {
  const [tasks, setTasks] = useState([]);
  const [newText, setNewText] = useState("");
  const [newDueDate, setNewDueDate] = useState("");
  const [newRecurrence, setNewRecurrence] = useState("none");
  const [editingId, setEditingId] = useState(null);
  const [editingText, setEditingText] = useState("");
  const [editingDueDate, setEditingDueDate] = useState("");
  const [editingRecurrence, setEditingRecurrence] = useState("none");
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  const [smartText, setSmartText] = useState("");
  const [parsing, setParsing] = useState(false);
  const [preview, setPreview] = useState(null);

  const [summary, setSummary] = useState(null);

  function handleError(err) {
    if (err.status === 401) {
      onLogout();
      return;
    }
    setError(err.message);
  }

  async function loadTasks() {
    setLoading(true);
    setError(null);
    try {
      const data = await apiFetch(token, "/tasks");
      setTasks(data);
    } catch (err) {
      handleError(err);
    } finally {
      setLoading(false);
    }
  }

  async function loadSummary() {
    try {
      const data = await apiFetch(token, "/tasks/summary");
      setSummary(data);
    } catch (err) {
      console.error("Summary failed:", err);
    }
  }

  useEffect(() => {
    loadTasks();
    loadSummary();
  }, []);

  async function handleAdd(e) {
    e.preventDefault();
    if (!newText.trim()) return;
    setError(null);
    try {
      await apiFetch(token, "/tasks", {
        method: "POST",
        body: JSON.stringify({
          text: newText,
          due_date: fromDatetimeLocalValue(newDueDate),
          recurrence: newRecurrence,
        }),
      });
      setNewText("");
      setNewDueDate("");
      setNewRecurrence("none");
      loadTasks();
      loadSummary();
    } catch (err) {
      handleError(err);
    }
  }

  async function handleSmartParse(e) {
    e.preventDefault();
    if (!smartText.trim()) return;
    setError(null);
    setParsing(true);
    try {
      const data = await apiFetch(token, "/tasks/parse", {
        method: "POST",
        body: JSON.stringify({ description: smartText }),
      });
      setPreview(data);
    } catch (err) {
      handleError(err);
    } finally {
      setParsing(false);
    }
  }

  async function confirmSmartAdd() {
    if (!preview) return;
    setError(null);
    try {
      await apiFetch(token, "/tasks", {
        method: "POST",
        body: JSON.stringify({
          text: preview.title,
          due_date: preview.due_date,
          recurrence: preview.recurrence,
        }),
      });
      setSmartText("");
      setPreview(null);
      loadTasks();
      loadSummary();
    } catch (err) {
      handleError(err);
    }
  }

  async function handleToggleDone(id) {
    setError(null);
    try {
      await apiFetch(token, `/tasks/${id}`, { method: "PATCH" });
      loadTasks();
      loadSummary();
    } catch (err) {
      handleError(err);
    }
  }

  async function handleDelete(id) {
    setError(null);
    try {
      await apiFetch(token, `/tasks/${id}`, { method: "DELETE" });
      loadTasks();
      loadSummary();
    } catch (err) {
      handleError(err);
    }
  }

  function startEdit(task) {
    setEditingId(task.id);
    setEditingText(task.text);
    setEditingDueDate(toDatetimeLocalValue(task.due_date));
    setEditingRecurrence(task.recurrence || "none");
  }

  async function saveEdit(id) {
    if (!editingText.trim()) return;
    setError(null);
    try {
      await apiFetch(token, `/tasks/${id}`, {
        method: "PUT",
        body: JSON.stringify({
          text: editingText,
          due_date: fromDatetimeLocalValue(editingDueDate),
          recurrence: editingRecurrence,
        }),
      });
      setEditingId(null);
      loadTasks();
      loadSummary();
    } catch (err) {
      handleError(err);
    }
  }

  const orderedTasks = sortByPriority(tasks, summary?.priority_order);

  return (
    <div>
      <div className="topbar">
        <h1>To-Do</h1>
        <button onClick={onLogout}>Log out</button>
      </div>

      {error && (
        <div className="error-banner">
          Something went wrong: {error}
        </div>
      )}

      {summary && (
        <div className="error-banner">
          <p>{summary.summary}</p>
        </div>
      )}

      <form onSubmit={handleAdd}>
        <input
          type="text"
          placeholder="New task"
          value={newText}
          onChange={(e) => setNewText(e.target.value)}
        />
        <input
          type="datetime-local"
          value={newDueDate}
          onChange={(e) => setNewDueDate(e.target.value)}
        />
        <select
          value={newRecurrence}
          onChange={(e) => setNewRecurrence(e.target.value)}
        >
          {RECURRENCE_OPTIONS.map((opt) => (
            <option key={opt} value={opt}>{opt}</option>
          ))}
        </select>
        <button type="submit" className="primary">Add</button>
      </form>

      <form onSubmit={handleSmartParse}>
        <input
          type="text"
          placeholder='Try: "remind me to call mom every Sunday at 6pm"'
          value={smartText}
          onChange={(e) => setSmartText(e.target.value)}
        />
        <button type="submit" className="primary" disabled={parsing}>
          {parsing ? "Parsing..." : "Smart Add"}
        </button>
      </form>

      {preview && (
        <div className="error-banner">
          <p><strong>{preview.title}</strong></p>
          <p>Due: {preview.due_date || "no date"}</p>
          <p>Repeats: {preview.recurrence}</p>
          <button className="primary" onClick={confirmSmartAdd}>Confirm & Save</button>
          <button onClick={() => setPreview(null)}>Discard</button>
        </div>
      )}

      <ul>
        {orderedTasks.map((task) => (
          <li key={task.id}>
            <input
              type="checkbox"
              checked={task.done}
              onChange={() => handleToggleDone(task.id)}
            />

            {editingId === task.id ? (
              <>
                <input
                  type="text"
                  value={editingText}
                  onChange={(e) => setEditingText(e.target.value)}
                />
                <input
                  type="datetime-local"
                  value={editingDueDate}
                  onChange={(e) => setEditingDueDate(e.target.value)}
                />
                <select
                  value={editingRecurrence}
                  onChange={(e) => setEditingRecurrence(e.target.value)}
                >
                  {RECURRENCE_OPTIONS.map((opt) => (
                    <option key={opt} value={opt}>{opt}</option>
                  ))}
                </select>
                <button onClick={() => saveEdit(task.id)}>Save</button>
                <button onClick={() => setEditingId(null)}>Cancel</button>
              </>
            ) : (
              <>
                <span className={"text" + (task.done ? " done" : "")}>
                  {task.text}
                </span>
                <span className="task-meta">
                  {task.due_date ? new Date(task.due_date).toLocaleString() : "no due date"}
                  {" · "}
                  {task.recurrence || "none"}
                </span>
                <button onClick={() => startEdit(task)}>Edit</button>
                <button className="danger" onClick={() => handleDelete(task.id)}>Delete</button>
              </>
            )}
          </li>
        ))}
      </ul>

      {!loading && tasks.length === 0 && !error && (
        <p className="loading">No tasks yet — add one above.</p>
      )}
    </div>
  );
}

function Root() {
  const [token, setToken] = useState(() => localStorage.getItem(TOKEN_STORAGE_KEY));

  function handleAuthenticated(newToken) {
    localStorage.setItem(TOKEN_STORAGE_KEY, newToken);
    setToken(newToken);
  }

  function handleLogout() {
    localStorage.removeItem(TOKEN_STORAGE_KEY);
    setToken(null);
  }

  return token ? (
    <TodoApp token={token} onLogout={handleLogout} />
  ) : (
    <AuthScreen onAuthenticated={handleAuthenticated} />
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>

</body>
</html>
