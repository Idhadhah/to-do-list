<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>
  To-Do</title>

<!-- React, without needing npm/webpack/vite -->
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<link rel="stylesheet" href="todo.css" />
</head>
<body>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

const API_BASE = "http://127.0.0.1:8000";
const TOKEN_STORAGE_KEY = "todo_token";
const SUMMARY_CACHE_KEY = "todo_summary_cache";
const TWENTY_FOUR_HOURS_MS = 24 * 60 * 60 * 1000;
const RECURRENCE_OPTIONS = ["none", "daily", "weekly", "monthly"];

async function apiFetch(token, path, options = {}) {
  const res = await fetch(API_BASE + path, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      ...(token ? { Authorization: "Bearer " + token } : {}),
      ...(options.headers || {}),
    },
  });

  if (!res.ok) {
    let detail = res.statusText;
    try {
      const body = await res.json();
      detail = body.detail || detail;
    } catch (_) {
    }
    const err = new Error(detail);
    err.status = res.status;
    throw err;
  }

  if (res.status === 204) return null;
  return res.json();
}

function toDatetimeLocalValue(isoString) {
  if (!isoString) return "";
  return isoString.slice(0, 16);
}

function fromDatetimeLocalValue(value) {
  return value ? value : null;
}

function sortByPriority(tasks, priorityOrder) {
  if (!priorityOrder || priorityOrder.length === 0) return tasks;
  const orderIndex = new Map(priorityOrder.map((id, i) => [id, i]));
  return [...tasks].sort((a, b) => {
    const aRank = orderIndex.has(a.id) ? orderIndex.get(a.id) : Infinity;
    const bRank = orderIndex.has(b.id) ? orderIndex.get(b.id) : Infinity;
    return aRank - bRank;
  });
}

function loadCachedSummary() {
  try {
    const raw = localStorage.getItem(SUMMARY_CACHE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch {
    return null;
  }
}

function getTaskStatus(task) {
  if (task.done) return "done";
  if (!task.due_date) return "none";
  const due = new Date(task.due_date);
  const now = new Date();
  if (due < now) return "overdue";
  if (due - now < TWENTY_FOUR_HOURS_MS) return "soon";
  return "upcoming";
}

function AuthScreen({ onAuthenticated }) {
  const [mode, setMode] = useState("login"); // "login" | "signup"
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState(null);
  const [submitting, setSubmitting] = useState(false);

  async function handleSubmit(e) {
    e.preventDefault();
    setError(null);
    setSubmitting(true);
    try {
      const data = await apiFetch(null, mode === "login" ? "/login" : "/signup", {
        method: "POST",
        body: JSON.stringify({ email, password }),
      });
      onAuthenticated(data.access_token);
    } catch (err) {
      setError(err.message);
    } finally {
      setSubmitting(false);
    }
  }

  return (
    <div className="page auth-page">
      <div className="card">
        <h1 style={{ textAlign: "center" }}>To-Do</h1>

        <div className="auth-tabs">
          <button
            type="button"
            className={mode === "login" ? "primary" : ""}
            onClick={() => { setMode("login"); setError(null); }}
          >
            Log in
          </button>
          <button
            type="button"
            className={mode === "signup" ? "primary" : ""}
            onClick={() => { setMode("signup"); setError(null); }}
          >
            Sign up
          </button>
        </div>

        {error && <div className="error-banner">Something went wrong: {error}</div>}

        <form onSubmit={handleSubmit} className="auth-form">
          <input
            type="email"
            placeholder="Email"
            value={email}
            onChange={(e) => setEmail(e.target.value)}
            required
          />
          <input
            type="password"
            placeholder="Password"
            value={password}
            onChange={(e) => setPassword(e.target.value)}
            minLength={mode === "signup" ? 8 : undefined}
            required
          />
          <button type="submit" className="primary" disabled={submitting}>
            {mode === "login" ? "Log in" : "Sign up"}
          </button>
        </form>
      </div>
    </div>
  );
}

function TodoApp({ token, onLogout }) {
  const [tasks, setTasks] = useState([]);
  const [newText, setNewText] = useState("");
  const [newDueDate, setNewDueDate] = useState("");
  const [newRecurrence, setNewRecurrence] = useState("none");
  const [editingId, setEditingId] = useState(null);
  const [editingText, setEditingText] = useState("");
  const [editingDueDate, setEditingDueDate] = useState("");
  const [editingRecurrence, setEditingRecurrence] = useState("none");
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  const [smartText, setSmartText] = useState("");
  const [parsing, setParsing] = useState(false);
  const [preview, setPreview] = useState(null);

  const [summaryCache, setSummaryCache] = useState(loadCachedSummary);
  const [summaryLoading, setSummaryLoading] = useState(false);
  const [summaryError, setSummaryError] = useState(null);

  function handleError(err) {
    if (err.status === 401) {
      onLogout();
      return;
    }
    setError(err.message);
  }

  async function loadTasks() {
    setLoading(true);
    setError(null);
    try {
      const data = await apiFetch(token, "/tasks");
      setTasks(data);
    } catch (err) {
      handleError(err);
    } finally {
      setLoading(false);
    }
  }

  function saveSummaryCache(cache) {
    setSummaryCache(cache);
    localStorage.setItem(SUMMARY_CACHE_KEY, JSON.stringify(cache));
  }

  async function loadSummary(force = false) {
    const now = Date.now();
    const isStale = !summaryCache || (now - summaryCache.fetchedAt) > TWENTY_FOUR_HOURS_MS;

    if (!force && !isStale) {
      return;
    }

    setSummaryLoading(true);
    setSummaryError(null);
    try {
      const data = await apiFetch(token, "/tasks/summary");
      saveSummaryCache({ data, fetchedAt: now });
    } catch (err) {
      setSummaryError(err.message);
    } finally {
      setSummaryLoading(false);
    }
  }

  useEffect(() => {
    loadTasks();
    loadSummary();
  }, []);

  async function handleAdd(e) {
    e.preventDefault();
    if (!newText.trim()) return;
    setError(null);
    try {
      await apiFetch(token, "/tasks", {
        method: "POST",
        body: JSON.stringify({
          text: newText,
          due_date: fromDatetimeLocalValue(newDueDate),
          recurrence: newRecurrence,
        }),
      });
      setNewText("");
      setNewDueDate("");
      setNewRecurrence("none");
      loadTasks();
      loadSummary(true);
    } catch (err) {
      handleError(err);
    }
  }

  async function handleSmartParse(e) {
    e.preventDefault();
    if (!smartText.trim()) return;
    setError(null);
    setParsing(true);
    try {
      const data = await apiFetch(token, "/tasks/parse", {
        method: "POST",
        body: JSON.stringify({ description: smartText }),
      });
      setPreview(data);
    } catch (err) {
      handleError(err);
    } finally {
      setParsing(false);
    }
  }

  async function confirmSmartAdd() {
    if (!preview) return;
    setError(null);
    try {
      await apiFetch(token, "/tasks", {
        method: "POST",
        body: JSON.stringify({
          text: preview.title,
          due_date: preview.due_date,
          recurrence: preview.recurrence,
        }),
      });
      setSmartText("");
      setPreview(null);
      loadTasks();
      loadSummary(true);
    } catch (err) {
      handleError(err);
    }
  }

  async function handleToggleDone(id) {
    setError(null);
    try {
      await apiFetch(token, `/tasks/${id}`, { method: "PATCH" });
      loadTasks();
      loadSummary(true);
    } catch (err) {
      handleError(err);
    }
  }

  async function handleDelete(id) {
    setError(null);
    try {
      await apiFetch(token, `/tasks/${id}`, { method: "DELETE" });
      loadTasks();
      loadSummary(true);
    } catch (err) {
      handleError(err);
    }
  }

  function startEdit(task) {
    setEditingId(task.id);
    setEditingText(task.text);
    setEditingDueDate(toDatetimeLocalValue(task.due_date));
    setEditingRecurrence(task.recurrence || "none");
  }

  async function saveEdit(id) {
    if (!editingText.trim()) return;
    setError(null);
    try {
      await apiFetch(token, `/tasks/${id}`, {
        method: "PUT",
        body: JSON.stringify({
          text: editingText,
          due_date: fromDatetimeLocalValue(editingDueDate),
          recurrence: editingRecurrence,
        }),
      });
      setEditingId(null);
      loadTasks();
      loadSummary(true);
    } catch (err) {
      handleError(err);
    }
  }

  const orderedTasks = sortByPriority(tasks, summaryCache?.data?.priority_order);
  const doneCount = tasks.filter((t) => t.done).length;
  const undoneCount = tasks.length - doneCount;

  return (
    <div className="page">
      <div className="card">
        <div className="topbar">
          <h1>To Do List</h1>
          <button onClick={onLogout}>Log out</button>
        </div>

        {error && (
          <div className="error-banner" style={{ marginBottom: 16 }}>
            Something went wrong: {error}
          </div>
        )}

        <div className="layout">
          <form onSubmit={handleAdd}>
            <input
              type="text"
              placeholder="Add your task"
              value={newText}
              onChange={(e) => setNewText(e.target.value)}
            />
            <button type="submit" className="primary">Add</button>
          </form>

          <form onSubmit={handleAdd}>
            <input
              type="datetime-local"
              value={newDueDate}
              onChange={(e) => setNewDueDate(e.target.value)}
            />
            <select
              value={newRecurrence}
              onChange={(e) => setNewRecurrence(e.target.value)}
            >
              {RECURRENCE_OPTIONS.map((opt) => (
                <option key={opt} value={opt}>{opt}</option>
              ))}
            </select>
          </form>

          <form onSubmit={handleSmartParse}>
            <input
              type="text"
              placeholder='Try: "remind me to call mom every Sunday at 6pm"'
              value={smartText}
              onChange={(e) => setSmartText(e.target.value)}
            />
            <button type="submit" className="primary" disabled={parsing}>
              {parsing ? "Parsing..." : "Smart Add"}
            </button>
          </form>

          {preview && (
            <div className="smart-preview">
              <div className="smart-preview-label">AI suggestion — confirm before saving</div>
              <div className="smart-preview-title">{preview.title}</div>
              <div className="smart-preview-meta">
                {preview.due_date ? new Date(preview.due_date).toLocaleString() : "No due date"}
                {" · "}
                {preview.recurrence}
              </div>
              <div className="smart-preview-actions">
                <button className="primary" onClick={confirmSmartAdd}>Confirm & save</button>
                <button onClick={() => setPreview(null)}>Discard</button>
              </div>
            </div>
          )}

          <div className="section-title">Task List</div>

          <ul>
            {orderedTasks.map((task) => {
              const status = getTaskStatus(task);
              const dueLabel = task.due_date
                ? new Date(task.due_date).toLocaleString()
                : "No due date";

              return (
                <li key={task.id} className={`task-card status-${status}`}>
                  <input
                    type="checkbox"
                    checked={task.done}
                    onChange={() => handleToggleDone(task.id)}
                  />

                  {editingId === task.id ? (
                    <div className="task-body">
                      <input
                        type="text"
                        value={editingText}
                        onChange={(e) => setEditingText(e.target.value)}
                        style={{ marginBottom: 8, width: "100%" }}
                      />
                      <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                        <input
                          type="datetime-local"
                          value={editingDueDate}
                          onChange={(e) => setEditingDueDate(e.target.value)}
                        />
                        <select
                          value={editingRecurrence}
                          onChange={(e) => setEditingRecurrence(e.target.value)}
                        >
                          {RECURRENCE_OPTIONS.map((opt) => (
                            <option key={opt} value={opt}>{opt}</option>
                          ))}
                        </select>
                      </div>
                      <div className="task-actions" style={{ marginTop: 8 }}>
                        <button className="link-btn edit" onClick={() => saveEdit(task.id)}>Save</button>
                        <button className="link-btn" onClick={() => setEditingId(null)}>Cancel</button>
                      </div>
                    </div>
                  ) : (
                    <>
                      <div className="task-body">
                        <div className="task-title">{task.text}</div>
                        <div className="task-meta">
                          <span>{dueLabel}</span>
                          <span>· {task.recurrence || "none"}</span>
                        </div>
                      </div>
                      <div className="task-actions">
                        <button className="link-btn" onClick={() => handleDelete(task.id)}>Delete</button>
                        <button className="link-btn edit" onClick={() => startEdit(task)}>Edit</button>
                      </div>
                    </>
                  )}
                </li>
              );
            })}
          </ul>

          {!loading && tasks.length === 0 && !error && (
            <p className="loading">No tasks yet — add one above.</p>
          )}

          <div className="task-footer">
            Completed: {doneCount} | Uncompleted: {undoneCount}
          </div>

          {summaryLoading && (
            <div className="summary-loading">Loading summary...</div>
          )}
          {summaryError && (
            <div className="error-banner">Summary unavailable: {summaryError}</div>
          )}
          {summaryCache && !summaryLoading && (
            <div className="summary-panel">
              <div className="summary-label">Summary</div>
              <div className="summary-text">{summaryCache.data.summary}</div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function Root() {
  const [token, setToken] = useState(() => localStorage.getItem(TOKEN_STORAGE_KEY));

  function handleAuthenticated(newToken) {
    localStorage.setItem(TOKEN_STORAGE_KEY, newToken);
    setToken(newToken);
  }

  function handleLogout() {
    localStorage.removeItem(TOKEN_STORAGE_KEY);
    setToken(null);
  }

  return token ? (
    <TodoApp token={token} onLogout={handleLogout} />
  ) : (
    <AuthScreen onAuthenticated={handleAuthenticated} />
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>

</body>
</html>
